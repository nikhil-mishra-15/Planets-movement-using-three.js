<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            max-height: 40vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        .control-group {
            margin-bottom: 10px;
        }
        
        label {
            display: inline-block;
            width: 80px;
            color: #fff;
        }
        
        input[type="range"] {
            width: calc(100% - 100px);
            vertical-align: middle;
        }
        
        .speed-value {
            display: inline-block;
            width: 40px;
            text-align: right;
            margin-left: 5px;
        }
        
        #header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
        }
        
        #pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 15px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #pause-btn:hover {
            background-color: #666;
        }
        
        #theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #theme-toggle:hover {
            background-color: #666;
        }
        
        .planet-label {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            #controls {
                padding: 10px;
                font-size: 14px;
            }
            
            label {
                width: 60px;
            }
            
            input[type="range"] {
                width: calc(100% - 80px);
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <h1>3D Solar System Simulation</h1>
        </div>
        <button id="theme-toggle">Light Mode</button>
        <button id="pause-btn">Pause</button>
        <canvas id="canvas"></canvas>
        <div id="controls">
            <div class="control-group">
                <label for="mercury-speed">Mercury:</label>
                <input type="range" id="mercury-speed" min="0" max="10" step="0.1" value="4.1">
                <span class="speed-value">4.1</span>
            </div>
            <div class="control-group">
                <label for="venus-speed">Venus:</label>
                <input type="range" id="venus-speed" min="0" max="10" step="0.1" value="1.6">
                <span class="speed-value">1.6</span>
            </div>
            <div class="control-group">
                <label for="earth-speed">Earth:</label>
                <input type="range" id="earth-speed" min="0" max="10" step="0.1" value="1">
                <span class="speed-value">1.0</span>
            </div>
            <div class="control-group">
                <label for="mars-speed">Mars:</label>
                <input type="range" id="mars-speed" min="0" max="10" step="0.1" value="0.5">
                <span class="speed-value">0.5</span>
            </div>
            <div class="control-group">
                <label for="jupiter-speed">Jupiter:</label>
                <input type="range" id="jupiter-speed" min="0" max="10" step="0.1" value="0.08">
                <span class="speed-value">0.08</span>
            </div>
            <div class="control-group">
                <label for="saturn-speed">Saturn:</label>
                <input type="range" id="saturn-speed" min="0" max="10" step="0.1" value="0.03">
                <span class="speed-value">0.03</span>
            </div>
            <div class="control-group">
                <label for="uranus-speed">Uranus:</label>
                <input type="range" id="uranus-speed" min="0" max="10" step="0.1" value="0.01">
                <span class="speed-value">0.01</span>
            </div>
            <div class="control-group">
                <label for="neptune-speed">Neptune:</label>
                <input type="range" id="neptune-speed" min="0" max="10" step="0.1" value="0.006">
                <span class="speed-value">0.006</span>
            </div>
        </div>
    </div>
    
    <div id="planet-label" class="planet-label"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script>
        
      // Scene setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// Camera position
camera.position.z = 50;

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Lighting
const ambientLight = new THREE.AmbientLight(0x333333);
scene.add(ambientLight);

const sunLight = new THREE.PointLight(0xffffff, 1, 100);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// Create stars
function createStars() {
    const starsGeometry = new THREE.BufferGeometry();
    const starsMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.1,
        transparent: true
    });

    const starsVertices = [];
    for (let i = 0; i < 10000; i++) {
        const x = (Math.random() - 0.5) * 2000;
        const y = (Math.random() - 0.5) * 2000;
        const z = (Math.random() - 0.5) * 2000;
        starsVertices.push(x, y, z);
    }

    starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
    const stars = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(stars);
}

createStars();

// Planet data
const planetData = [
    { name: "Sun", radius: 6, color: 0xffff00, orbitRadius: 0, speed: 0, rotationSpeed: 0.01 },
    { name: "Mercury", radius: 0.4, color: 0xaaaaaa, orbitRadius: 10, speed: 4.1, rotationSpeed: 0.004 },
    { name: "Venus", radius: 0.6, color: 0xffaa00, orbitRadius: 15, speed: 1.6, rotationSpeed: 0.002 },
    { name: "Earth", radius: 0.6, color: 0x00aaff, orbitRadius: 20, speed: 1, rotationSpeed: 0.02 },
    { name: "Mars", radius: 0.4, color: 0xff3300, orbitRadius: 25, speed: 0.5, rotationSpeed: 0.018 },
    { name: "Jupiter", radius: 1.3, color: 0xffcc99, orbitRadius: 35, speed: 0.08, rotationSpeed: 0.04 },
    { name: "Saturn", radius: 1.1, color: 0xffdd66, orbitRadius: 45, speed: 0.03, rotationSpeed: 0.038, hasRing: true },
    { name: "Uranus", radius: 0.9, color: 0x66ccff, orbitRadius: 55, speed: 0.01, rotationSpeed: 0.03 },
    { name: "Neptune", radius: 0.8, color: 0x3366ff, orbitRadius: 65, speed: 0.006, rotationSpeed: 0.032 }
];

const planets = [];
const orbitLines = [];

// Create planets and orbits
planetData.forEach((data, index) => {
    const geometry = new THREE.SphereGeometry(data.radius, 32, 32);
    let material;
    
    if (index === 0) { // Sun
        material = new THREE.MeshBasicMaterial({ 
            color: data.color,
            emissive: data.color,
            emissiveIntensity: 1
        });
    } else {
        material = new THREE.MeshPhongMaterial({ 
            color: data.color,
            shininess: 10
        });
    }
    
    const planet = new THREE.Mesh(geometry, material);
    
    if (data.orbitRadius > 0) {
        // Position planet on its orbit
        planet.position.x = data.orbitRadius;
        
        // Create orbit line
        const orbitGeometry = new THREE.BufferGeometry();
        const orbitMaterial = new THREE.LineBasicMaterial({ color: 0x555555 });
        const points = [];
        const segments = 64;
        
        for (let i = 0; i <= segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            points.push(new THREE.Vector3(
                Math.cos(angle) * data.orbitRadius,
                Math.sin(angle) * data.orbitRadius,
                0
            ));
        }
        
        orbitGeometry.setFromPoints(points);
        const orbitLine = new THREE.Line(orbitGeometry, orbitMaterial);
        scene.add(orbitLine);
        orbitLines.push(orbitLine);
    }
    
    scene.add(planet);
    planets.push({
        mesh: planet,
        angle: Math.random() * Math.PI * 2,
        speed: data.speed,
        rotationSpeed: data.rotationSpeed,
        orbitRadius: data.orbitRadius,
        name: data.name
    });
    
    // Add rings to Saturn
    if (data.hasRing) {
        const ringGeometry = new THREE.RingGeometry(data.radius * 1.5, data.radius * 2, 32);
        const ringMaterial = new THREE.MeshPhongMaterial({
            color: 0xddddbb,
            side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = Math.PI / 2;
        planet.add(ring);
    }
});

// Animation state
let isPaused = false;
const clock = new THREE.Clock();

// Speed controls
const speedControls = {};
planetData.slice(1).forEach(data => {
    const slider = document.getElementById(`${data.name.toLowerCase()}-speed`);
    const valueDisplay = slider.nextElementSibling;
    
    slider.addEventListener('input', () => {
        const speed = parseFloat(slider.value);
        valueDisplay.textContent = speed.toFixed(1);
        
        // Find the planet and update its speed
        const planet = planets.find(p => p.name === data.name);
        if (planet) {
            planet.speed = speed;
        }
    });
    
    speedControls[data.name] = slider;
});

// Pause button
document.getElementById('pause-btn').addEventListener('click', () => {
    isPaused = !isPaused;
    document.getElementById('pause-btn').textContent = isPaused ? 'Resume' : 'Pause';
});

// Theme toggle
document.getElementById('theme-toggle').addEventListener('click', () => {
    document.body.style.backgroundColor = document.body.style.backgroundColor === 'rgb(0, 0, 0)' ? '#f0f0f0' : '#000';
    document.body.style.color = document.body.style.color === 'rgb(255, 255, 255)' ? '#000' : '#fff';
    document.getElementById('theme-toggle').textContent = 
        document.getElementById('theme-toggle').textContent === 'Light Mode' ? 'Dark Mode' : 'Light Mode';
    
    // Update orbit line colors
    const newColor = document.body.style.backgroundColor === 'rgb(0, 0, 0)' ? 0x555555 : 0xaaaaaa;
    orbitLines.forEach(line => {
        line.material.color.setHex(newColor);
    });
});

// Planet labels
const label = document.getElementById('planet-label');
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('mousemove', (event) => {
    // Calculate mouse position in normalized device coordinates
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    
    // Update the raycaster
    raycaster.setFromCamera(mouse, camera);
    
    // Calculate objects intersecting the picking ray
    const intersects = raycaster.intersectObjects(planets.map(p => p.mesh));
    
    if (intersects.length > 0) {
        const planet = planets.find(p => p.mesh === intersects[0].object);
        if (planet) {
            label.textContent = planet.name;
            label.style.opacity = '1';
            
            // Position label near the planet
            const planetPosition = planet.mesh.position.clone().project(camera);
            label.style.left = `${(planetPosition.x * 0.5 + 0.5) * window.innerWidth}px`;
            label.style.top = `${(-(planetPosition.y * 0.5) + 0.5) * window.innerHeight}px`;
        }
    } else {
        label.style.opacity = '0';
    }
});

// Animation loop
function animate() {
    requestAnimationFrame(animate);
    
    if (!isPaused) {
        const delta = clock.getDelta();
        
        planets.forEach(planet => {
            if (planet.orbitRadius > 0) { // Skip the Sun
                // Orbit rotation
                planet.angle += planet.speed * delta * 0.1;
                planet.mesh.position.x = Math.cos(planet.angle) * planet.orbitRadius;
                planet.mesh.position.z = Math.sin(planet.angle) * planet.orbitRadius;
            }
            
            // Planet rotation
            planet.mesh.rotation.y += planet.rotationSpeed * delta;
        });
    }
    
    controls.update();
    renderer.render(scene, camera);
}

// Handle window resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start animation
animate();

    </script>
</body>
</html>
